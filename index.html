<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Razel Rosal — IT student, troubleshooting, web development portfolio." />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Navigation menu-->
    <nav>
        <div class="nav-container">
            <div class="logo">
                <img src="Assets/logo1.png" alt="Razel Rosal Logo" />
            </div>
            <div class="links">
                <div class="link"><a href="#home">Home</a></div>
                <div class="link"><a href="#about">About</a></div>
                <div class="link"><a href="#skills">Skills</a></div>
                <div class="link"><a href="#projects">Projects</a></div>
                <div class="link"><a href="#ojt">OJT</a></div>
                <div class="link"><a href="#contact">Contact</a></div>
            </div>
            <button class="hamburg" aria-controls="mobile-menu" aria-expanded="false" aria-label="Open menu">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
        </div>
        <div id="mobile-menu" class="dropdown" hidden>
            <div class="links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#ojt">OJT</a>
                <a href="#contact">Contact</a>
                <button class="cancel" aria-label="Close menu">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <div class="home-container">
            <!-- Left: Image -->
            <div class="home-img">
                <picture>
                    <source srcset="Assets/prof.png" type="image/webp">
                    <img src="Assets/prof.png" alt="Razel Rosal — portrait" width="280" height="280" loading="lazy">
                </picture>
            </div>

            <!-- Right: Intro Text -->
            <div class="home-text">
                <h1><span class="typing" aria-live="polite"></span></h1>
                <noscript><h2>Hello, I am Razel Rosal</h2></noscript>
                <p>I'm passionate about technology, coding, and creating modern solutions.</p>
            </div>
        </div>
    </section>

    <!-- About Me Section (loaded from about.html) -->
    <section id="about" data-include="about.html"></section>

    <!-- Skills Section (loaded from skills.html) -->
    <section id="skills" data-include="skills.html"></section>

    <!-- Projects Section (loaded from projects.html) -->
    <section id="projects" data-include="projects.html"></section>

    <!-- OJT Section (loaded from ojt.html) -->
    <section id="ojt" data-include="ojt.html"></section>


    <!-- Contact Section (loaded from contact.html) -->
    <section id="contact" data-include="contact.html"></section>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load HTML partials for sections marked with data-include before initializing
            async function loadIncludes() {
                const includes = document.querySelectorAll('[data-include]');
                await Promise.all(Array.from(includes).map(async el => {
                    const url = el.getAttribute('data-include');
                    try {
                        const res = await fetch(url);
                        if (!res.ok) throw new Error('Failed to load ' + url + ' (' + res.status + ')');
                        el.innerHTML = await res.text();
                    } catch (err) {
                        console.error(err);
                        el.innerHTML = '<div style="padding:20px;background:#111;color:#fff;border-radius:8px;">Could not load ' + url + '</div>';
                    }
                }));
            }

            await loadIncludes();

            // Accessible mobile menu toggle
            const burger = document.querySelector('.hamburg');
            const menu = document.getElementById('mobile-menu');
            const closeBtn = document.querySelector('#mobile-menu .cancel');

            function openMenu() {
                burger.setAttribute('aria-expanded', 'true');
                menu.hidden = false;
                const firstLink = menu.querySelector('a');
                if (firstLink) firstLink.focus();
            }

            function closeMenu() {
                burger.setAttribute('aria-expanded', 'false');
                menu.hidden = true;
                burger.focus();
            }

            burger.addEventListener('click', () => {
                const expanded = burger.getAttribute('aria-expanded') === 'true';
                if (expanded) closeMenu(); else openMenu();
            });

            if (closeBtn) closeBtn.addEventListener('click', closeMenu);

            // Close when a link is clicked
            menu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

            // Close on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeMenu();
            });

            // Progress bars: set widths from data-value
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            function setProgressBars() {
                document.querySelectorAll('.progress-bar').forEach(pb => {
                    const val = pb.dataset.value || '0';
                    const bar = pb.querySelector('.progress');
                    if (!bar) return;
                    bar.textContent = val + '%';
                    if (reduceMotion) {
                        bar.style.width = val + '%';
                    } else {
                        // start at 0 then animate to value
                        bar.style.width = '0%';
                        requestAnimationFrame(() => { setTimeout(() => { bar.style.width = val + '%'; }, 50); });
                    }
                });
            }

            setProgressBars();

            // Typing animation (reduced-motion aware)
            const texts = [
                'Hello, I am Razel Rosal',
                'I am an IT Student',
                'I am a Tech Enthusiast'
            ];
            const typingEl = document.querySelector('.typing');
            if (typingEl) {
                if (reduceMotion) {
                    typingEl.textContent = texts[0];
                } else {
                    let tIndex = 0;
                    let charIndex = 0;
                    function typeLoop() {
                        if (tIndex >= texts.length) tIndex = 0;
                        const current = texts[tIndex];
                        charIndex++;
                        typingEl.textContent = current.slice(0, charIndex);
                        if (charIndex === current.length) {
                            tIndex++;
                            charIndex = 0;
                            setTimeout(typeLoop, 1400);
                        } else {
                            setTimeout(typeLoop, 80);
                        }
                    }
                    typeLoop();
                }
            }

      
        });
    </script>
</body>
</html>
